name: Publish Packages

on:
  push:
    branches: [main]

jobs:
    version:
        runs-on: ubuntu-latest
        permissions:
            id-token: write # required for provenance https://docs.npmjs.com/generating-provenance-statements#publishing-packages-with-provenance-via-github-actions
            contents: write
            pull-requests: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # Reads the pnpm version from package.json "packageManager".
            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Install Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              # No dependency cache here: this job holds the npm token, and Actions caches on
              # main can be written by other workflows (cache poisoning). Install fresh instead.
              with:
                node-version-file: ".nvmrc"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Create release Pull Request or publish to NPM
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  commit: "ci(changesets): version packages"
                  title: "Changeset: New Version"
                  # Also refreshes pnpm-lock.yaml, since bumped internal ranges are recorded in it.
                  version: pnpm changeset:version
                  publish: pnpm publish-ci
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.WORKLEAP_NPM_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.WORKLEAP_NPM_TOKEN }}
