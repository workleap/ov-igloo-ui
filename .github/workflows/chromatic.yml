# Chromatic Main and Active PRs only
# Trigger example found here: https://github.com/chromaui/chromatic-cli/blob/main/.github/workflows/chromatic-main-and-prs.yml

name: Chromatic

on:
  push:
    branches:
      - main
  pull_request:
    # Workflows will not run on pull_request activity if the pull request has a merge conflict. The merge conflict must be resolved first.
    # By default, a workflow only runs when a pull_request event's activity type is opened, synchronize, or reopened.
    branches-ignore:
    - changeset-release/*
    - dependabot/*

jobs:
    chromatic-deployment:
        runs-on: ubuntu-latest
        # Chromatic reports PR status through its GitHub app; the job needs no write access.
        permissions:
          contents: read
        steps:
          - name: Checkout Commit
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              fetch-depth: 0

          # Reads the pnpm version from package.json "packageManager".
          - name: Install pnpm
            uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

          - name: Install Node.js
            uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
            with:
              node-version-file: ".nvmrc"
              cache: pnpm

          - name: Install dependencies
            run: pnpm install --frozen-lockfile

          - name: Run build Shared components
            run: pnpm build:shared

          - name: Run build Components
            run: pnpm build:components

          - name: Publish to Chromatic
            uses: chromaui/action@5d18868345f53a8f61258ad393396c7e169100fd # v18.14.4
            with:
              projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
              traceChanged: true
              onlyChanged: true # TurboSnap
              exitOnceUploaded: true # The PRs will be marked as success/failure based on the Chromatic build status
              skip: ${{ github.event.pull_request.draft == true }}
