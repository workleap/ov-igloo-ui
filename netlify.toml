[build]
  command = "pnpm build:shared && pnpm build:components && pnpm doc:build"
  publish = "website/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  included_files = ["!node_modules/.cache/**/*", "!node_modules/@swc/**/*"]

[build.environment]
  NODE_OPTIONS = "--max_old_space_size=8192"
  # @netlify/plugin-nextjs v4 needs a hoisted node_modules with pnpm (Netlify only; local installs stay isolated).
  # pnpm 12 has no --shamefully-hoist flag, so it is set through pnpm's environment config.
  PNPM_CONFIG_SHAMEFULLY_HOIST = "true"
